name: Weekly Data Update

# Mondays 10:00 UTC (after the weekend's games). workflow_dispatch lets you
# trigger it by hand from the Actions tab at any time.
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

# Give the whole job room: the situation engines walk every game.
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Every builder defaults HOCKEYROI_ROOT to a hardcoded local Mac path
      # (~58 scripts do this). Without this the runner looks for
      # /Users/ashgarg/... and dies. Point it at the checkout instead.
      HOCKEYROI_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r Streamlit/requirements.txt
          pip install scikit-learn        # xG model (not needed by the app itself)

      # ---- 1. Pull new games from the NHL API -------------------------------
      # NOTE: Zones/scripts/update_daily.py is deliberately NOT run here. It
      # needs the raw play-by-play cache (Zones/scripts/raw/, ~5.5k games) and
      # the 128MB nhl_shot_events.csv, both gitignored and absent on a runner.
      # Run it locally, then push. Everything below is CI-portable.
      - name: NFI current-season update (backfills missing games)
        run: python NFI/scripts/update_current_season.py

      # ---- 2. Box score — straight from the NHL Stats API --------------------
      - name: Box score (NHL Stats API)
        run: python NFI/scripts/build_box_score.py

      # ---- 3. Rebuild the per-situation engines ------------------------------
      # The raw CSVs (nhl_shot_events ~128MB, shift_data ~426MB) are gitignored
      # and NOT on the runner. These builders fall back to the committed
      # per-season parquets (Data/shot_events_by_season, Data/shift_data_by_season)
      # via NFI/scripts/_data_sources.py, which is what makes this step possible.
      - name: Per-situation TOI
        run: python NFI/scripts/build_situation_toi.py

      - name: Per-situation on-ice (players)
        run: python NFI/scripts/build_situation_onice.py

      - name: Per-situation on-ice (teams)
        run: python NFI/scripts/build_situation_onice_team.py

      # CCG (Chaos Created Goals). CCG needs faceoff/stoppage events (for the
      # no-crossing-a-whistle rule) that the shot parquet lacks, so we keep a
      # committed per-season EVENT parquet (Data/ccg_events_by_season). Step 1
      # appends any games update_current_season just fetched into Zones/raw/pbp
      # to that parquet (incremental; existing games skipped). Step 2 rebuilds
      # the CCG CSVs from the full committed parquet — identical to a local run.
      - name: CCG event parquet (append newly-fetched games)
        run: python Zones/scripts/build_ccg_events.py

      - name: CCG rebuild from committed event parquets
        run: python Zones/scripts/build_ccg_by_season.py

      # ---- 3b. Elites: Player Ratings + Elite Context -----------------------
      # 5v5 scoring parquet (goals + PRIMARY ASSISTS — the shot parquet has no
      # assists) is committed & CI-portable; this appends the games
      # update_current_season just fetched into Zones/raw/pbp, exactly like CCG.
      - name: Elites 5v5 scoring parquet (append new games)
        run: python Elites/scripts/2026_08/build_elites_scoring.py

      # ev_shifts.csv (~280MB) is rebuilt on the runner from the committed shift
      # parquets and is NOT committed — only the small ratings/context CSVs are.
      - name: Elites — rebuild EV shift intervals (runner-only)
        run: python Elites/scripts/2026_08/shifts_ingest.py

      - name: Elites tiers (prior-2yr + same-season)
        run: python Elites/scripts/2026_08/tiers.py

      - name: Player Ratings (0–100)
        run: python Elites/scripts/2026_08/build_player_ratings.py

      - name: Elite Context (quality of competition)
        run: python Elites/scripts/2026_08/build_elite_context.py

      # PP / PK ratings (part of the Player Ratings family). Transforms the
      # SpecialTeams pp_rating/pk_rating CSVs into app files. The SpecialTeams
      # pipeline isn't CI-portable yet, so on the runner this is a no-op that
      # keeps the committed pp_pk_ratings snapshot (see build_pp_pk_app.py); once
      # the SpecialTeams builders are wired here it will refresh weekly.
      - name: PP / PK ratings (app files)
        run: python Elites/scripts/2026_08/build_pp_pk_app.py

      # ---- 4. Commit whatever changed ---------------------------------------
      # Only the generated data files are staged, explicitly — never `git add .`.
      - name: Commit and push updated data
        run: |
          git config user.email "hockeyroi-bot@noreply.github.com"
          git config user.name "HockeyROI Bot"
          git add -A Zones/adjusted_rankings/ 2>/dev/null || true
          git add -A Zones/output/ 2>/dev/null || true
          git add -A NFI/output/fully_adjusted/current_season_player_fully_adjusted.csv 2>/dev/null || true
          git add -A NFI/processed_game_ids.json 2>/dev/null || true
          git add -A NFI/last_updated_current.txt 2>/dev/null || true
          git add -A Data/player_situation_toi.csv 2>/dev/null || true
          git add -A Data/player_situation_onice.csv 2>/dev/null || true
          git add -A Data/team_situation_onice.csv 2>/dev/null || true
          git add -A Data/box_score_skaters.csv 2>/dev/null || true
          git add -A Data/ccg_events_by_season/ 2>/dev/null || true
          git add -A Data/player_ccg_by_season.csv 2>/dev/null || true
          git add -A Data/team_ccg_by_season.csv 2>/dev/null || true
          git add -A Data/elites_scoring_by_season/ 2>/dev/null || true
          git add -A Elites/Output/player_ratings/ 2>/dev/null || true
          git add -A Elites/Output/elite_context/ 2>/dev/null || true
          git add -A Elites/Output/pp_pk_ratings/ 2>/dev/null || true
          find Zones -name "last_updated_*.txt" -exec git add {} \; 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Weekly data update $(date +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
